<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>

  <!-- MathJax v2 配置 -->
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      tex2jax: {
        inlineMath: [ ['$','$'], ["\\(","\\)"] ],
        displayMath: [ ['$$','$$'], ["\

\[","\\]

"] ],
        processEscapes: true
      },
      TeX: {
        equationNumbers: { autoNumber: "AMS" }
      },
      "HTML-CSS": { fonts: ["TeX"] }
    });
  </script>
  <script type="text/javascript" async
    src="https://cdn.jsdelivr.net/gh/mathjax/MathJax@2.7.9/MathJax.js?config=TeX-MML-AM_CHTML">
  </script>

  <style>
    body {
      max-width: 800px;
      margin: auto;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 20px;
    }
    h1, h2, h3 {
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.3em;
    }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
